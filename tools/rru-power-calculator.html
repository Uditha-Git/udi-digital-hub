<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRU Power Calculator V3</title>


<style>

body {

    font-family: Arial, sans-serif;
    background:#f5f7fb;
    padding:20px;

}


.container {

    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);

h1 {

    text-align:center;
    color:#1d4ed8;

}


.section {

    margin-top:20px;
    padding:15px;
    background:#f8fafc;
    border-radius:10px;

}


h2 {

    color:#e63946;

}



.input-grid {

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;

}



label {

    font-weight:bold;

}


input {

    width:100%;
    padding:8px;
    margin-top:5px;
    border-radius:6px;
    border:1px solid #ccc;

}



button {

    background:#1d4ed8;
    color:white;
    border:none;
    padding:10px 18px;
    margin:5px;
    border-radius:6px;
    cursor:pointer;

}


button:hover {

    opacity:0.8;

}



table {

    width:100%;
    border-collapse:collapse;

}


th {

    background:#1d4ed8;
    color:white;

}


th,td {

    border:1px solid #ccc;
    padding:10px;
    text-align:center;

}



</style>


</head>



<body>


<div class="container">


<h1>
RRU Power Calculator V3
</h1>



<div class="section">


<h2>
Input Parameters
</h2>


<div class="input-grid">



<div>

<label>
Reference Signal Power (dBm)
</label>

<input id="rsPower"
type="number"
value="18.2">

</div>




<div>

<label>
Maximum RS Power (dBm)
</label>

<input id="maxRsPower"
type="number"
value="20.2">

</div>




<div>

<label>
PA Value (dB)
</label>

<input id="paValue"
type="number"
value="0">

</div>




<div>

<label>
PB Value (dB)
</label>

<input id="pbValue"
type="number"
value="-3">

</div>




<div>

<label>
Number of TX Chains
</label>

<input id="txChains"
type="number"
value="4">

</div>




<div>

<label>
RRU Output Power (dBm)
</label>

<input id="rruPower"
type="number"
value="49">

</div>



</div>


</div>





<div class="section">


<h2>
Calculation Results
</h2>



<table>


<tr>

<th>
Parameter
</th>

<th>
Value
</th>

</tr>



<tr>

<td>
Adjusted RS Power
</td>

<td id="adjustedRs">
-
</td>

</tr>



<tr>

<td>
Estimated PDSCH Power
</td>

<td id="pdschPower">
-
</td>

</tr>



<tr>

<td>
Total TX Power
</td>

<td id="totalPower">
-
</td>

</tr>



<tr>

<td>
Carrier Power
</td>

<td id="carrierPower">
-
</td>

</tr>



<tr>

<td>
Per TX Chain Power
</td>

<td id="chainPower">
-
</td>

</tr>



</table>


</div>





<div class="section">


<h2>
Actions
</h2>


<button onclick="calculatePower()">
Calculate
</button>


<button onclick="copyResult()">
Copy Result
</button>


<button onclick="exportCSV()">
Export CSV
</button>


<button onclick="clearData()">
Clear
</button>


</div>




</div>


    <script>


// dBm to Watt conversion

function dbmToWatt(dbm){

    return Math.pow(10,(dbm-30)/10);

}



// Watt to dBm conversion

function wattToDbm(watt){

    return (10 * Math.log10(watt)) + 30;

}




function calculatePower(){



    // Read Inputs

    let rsPower =
    parseFloat(document.getElementById("rsPower").value);


    let maxRsPower =
    parseFloat(document.getElementById("maxRsPower").value);


    let pa =
    parseFloat(document.getElementById("paValue").value);


    let pb =
    parseFloat(document.getElementById("pbValue").value);


    let txChains =
    parseInt(document.getElementById("txChains").value);


    let rruPower =
    parseFloat(document.getElementById("rruPower").value);





    /*
    
    PA / PB Logic

    PB = -3 dB
    Means PDSCH is reduced by 3 dB
    RS power becomes relatively higher

    */


    let adjustedRS = rsPower - pb;



    // Maximum RS Power limitation

    if(adjustedRS > maxRsPower){

        adjustedRS = maxRsPower;

    }







    /*
    
    Estimated PDSCH Power

    PDSCH = RS Power + PA + PB

    */


    let pdschPower =
    rsPower + pa + pb;






    /*
    
    TX Chain Power

    Total Power = 
    Chain Power + 10log10(Number of Chains)

    */


    let chainPower =
    rruPower - 
    (10 * Math.log10(txChains));



    let totalPower =
    chainPower +
    (10 * Math.log10(txChains));






    /*
    
    Carrier Power

    Single carrier assumption

    */


    let carrierPower =
    totalPower;







    // Display Results


    document.getElementById("adjustedRs").innerHTML =
    adjustedRS.toFixed(2) + " dBm";



    document.getElementById("pdschPower").innerHTML =
    pdschPower.toFixed(2) + " dBm";



    document.getElementById("totalPower").innerHTML =
    totalPower.toFixed(2) + " dBm";



    document.getElementById("carrierPower").innerHTML =
    carrierPower.toFixed(2) + " dBm";



    document.getElementById("chainPower").innerHTML =
    chainPower.toFixed(2) + " dBm";



}





// Auto calculate when page loads

window.onload = function(){

    calculatePower();

};



</script>

// Clear Function

function clearData(){


document.getElementById("rsPower").value = 18.2;


document.getElementById("maxRsPower").value = 20.2;


document.getElementById("paValue").value = 0;


document.getElementById("pbValue").value = -3;

</script>



</body>

</html>
